<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INX · CBZ / CBR to XTC</title>
  <style>
    :root{color-scheme:light;--ink:#182027;--muted:#6d767c;--line:#dfe3e6;--soft:#f5f6f7;--accent:#22272b;--good:#247a50;--bad:#a23b32}
    *{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main.wrap{display:block;width:calc(100% - 68px);max-width:none;margin:0 0 0 68px!important;padding:102px 36px 60px!important}h2{font-size:16px;margin:0 0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin:12px 0;box-shadow:0 2px 7px #18202708}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-weight:650;font-size:12px;color:#4e585e}.field input,.field select{width:100%;min-height:38px;border:1px solid #cdd3d7;border-radius:6px;padding:7px 9px;background:#fff;color:inherit}.field input[type=range]{min-height:26px;padding:0;accent-color:var(--accent)}output{font-weight:700;color:var(--ink)}.check{display:flex;align-items:center;gap:8px;min-height:38px}.check input{width:17px;height:17px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{margin:0}.primary,.button{border:1px solid #c4cacf;border-radius:6px;background:#fff;color:var(--ink);padding:9px 13px;cursor:pointer;font:inherit}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.file{border:1px dashed #aeb7bd;border-radius:8px;padding:16px;background:#fafbfb}.file input{display:block;width:100%}.hint,.status{color:var(--muted);font-size:12px}.status{min-height:20px;margin-top:10px}.progress{height:8px;background:#e9edef;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;width:0;background:#3d7f67;transition:width .15s}.jobs{width:100%;border-collapse:collapse;margin-top:12px}.jobs th,.jobs td{text-align:left;border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:top}.jobs th{font-size:11px;text-transform:uppercase;color:var(--muted)}.ok{color:var(--good)}.error{color:var(--bad)}@media(max-width:760px){main.wrap{width:100%;margin:0!important;padding:82px 14px 40px!important}.grid{grid-template-columns:1fr}}
  </style>
  <style>
    .workspace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);gap:14px;align-items:start}.preview-column{position:sticky;top:14px;min-width:0}.controls-column{min-width:0}.preview-stage{display:flex;justify-content:center;align-items:flex-start;gap:14px;min-height:250px;max-height:calc(100vh - 150px);padding:16px;background:#eef1f2;border:1px solid var(--line);border-radius:8px;overflow:auto}.preview-page{display:block;max-width:100%;height:auto;width:auto;max-height:calc(100vh - 205px);background:#fff;box-shadow:0 3px 12px #18202722;image-rendering:auto}.preview-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px}.preview-label{font-size:12px;color:var(--muted)}@media(max-width:820px){.workspace{grid-template-columns:1fr}.preview-column{position:static}.preview-stage{max-height:none}.preview-page{max-height:62vh}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="workspace">
      <div class="preview-column">
        <section class="card">
          <div class="preview-stage" id="previewStage"></div>
          <div class="preview-meta"><span class="preview-label" id="previewLabel">Select a CBZ or CBR file</span><span class="preview-label" id="previewSize">480 × 800 px</span></div>
        </section>
      </div>
      <div class="controls-column">
    <section class="card">
      <h2>Conversion settings</h2>
      <div class="grid">
        <div class="field"><label for="orientation">Orientation</label><select id="orientation"><option value="landscape">Landscape</option><option value="portrait">Portrait</option></select></div>
        <div class="field"><label for="splitMode">Page split</label><select id="splitMode"><option value="nosplit" data-portrait-only>No split</option><option value="split3" data-landscape-only selected>Split in thirds</option></select></div>
        <div class="field"><label for="contrast">Contrast <output id="contrastValue" for="contrast">4</output></label><input id="contrast" type="range" min="0" max="20" step="1" value="4"></div>
        <label class="check"><input id="splitSpreads" type="checkbox"> Split wide spreads right-to-left</label>
      </div>
    </section>
    <section class="card">
      <h2>Files</h2>
      <div class="file"><input id="files" type="file" accept=".cbz,.cbr,application/x-cbz,application/x-cbr" multiple><div class="hint">CBZ and CBR files can be selected together.</div></div>
      <div class="row" style="margin-top:12px"><div class="field" style="flex:1;min-width:240px"><label for="destination">Upload folder on the reader</label><input id="destination" value="/" placeholder="/Books"></div><button class="primary" id="start" type="button">Convert &amp; upload selected files</button></div>
      <div class="progress"><i id="progress"></i></div><div class="status" id="status">Ready.</div>
      <table class="jobs"><thead><tr><th>File</th><th>Pages</th><th>Result</th></tr></thead><tbody id="jobs"><tr><td colspan="3" class="hint">No files selected.</td></tr></tbody></table>
    </section>
      </div>
    </div>
  </main>
  <script defer src="/js/plugin/xtc-converter?v=1.0.7"></script>
</body>
</html>
